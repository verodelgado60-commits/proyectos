# El plan gratuito de Supabase pausa proyectos tras 7 días sin actividad.
# Este flujo hace una consulta mínima dos veces por semana para mantenerlo activo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 14 * * 1,4"   # lunes y jueves, 8:17 a. m. hora de Costa Rica
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Consulta mínima a la base de datos
        run: |
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json \
                | jq -r '[.[] | select(.name=="anon" or .type=="publishable")][0].api_key')
          echo "::add-mask::$KEY"
          curl -fsS -X POST "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/rpc/username_available" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"u":"mantener-activo"}'
