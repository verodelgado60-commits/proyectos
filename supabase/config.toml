# Configuración de Supabase como código. GitHub Actions la aplica con `supabase config push`.
# Registro público desactivado: solo la administradora crea cuentas (función admin-users).
# Solo se declaran las opciones que queremos controlar; el resto queda como esté en Supabase.
project_id = "gestor-proyectos"

[auth]
enabled = true
# URL pública del sitio (la inyecta GitHub Actions desde la variable SITE_URL)
site_url = "env(SITE_URL)"
additional_redirect_urls = ["env(SITE_URL)"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

# La función verifica la sesión por su cuenta (acepta claves publicables nuevas y el arranque desde GitHub)
[functions.admin-users]
verify_jwt = false
